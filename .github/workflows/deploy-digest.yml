name: Deploy SwiftVietnam Digest

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "newsletter/**"
      - ".github/workflows/deploy-digest.yml"
  schedule:
    # 00:00 Sunday Asia/Singapore == 16:00 Saturday UTC
    - cron: "0 16 * * 6"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: newsletter/package-lock.json

      - name: Install deps
        working-directory: newsletter
        run: npm ci

      - name: Build weekly site (from current markdown)
        working-directory: newsletter
        env:
          TZ: Asia/Singapore
          DAYS: "7"
        run: node scripts/build-weekly-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: newsletter/site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
