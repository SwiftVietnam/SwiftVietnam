name: Deploy SwiftVietnam Digest

on:
  workflow_dispatch:

  # NOTE: pushes made by GitHub Actions (GITHUB_TOKEN) do NOT trigger other workflows.
  # Our crawl job commits content daily, so we deploy on workflow completion instead.
  workflow_run:
    workflows: ["Crawl RSS sources (SwiftVietnam Digest)"]
    types: [completed]

  push:
    branches: ["master"]
    paths:
      - "newsletter/**"
      - ".github/workflows/deploy-digest.yml"

  schedule:
    # Keep a weekly backstop deploy.
    # 00:00 Sunday Asia/Singapore == 16:00 Saturday UTC
    - cron: "0 16 * * 6"

permissions:
  contents: write

concurrency:
  group: "digest-deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: newsletter/package-lock.json

      - name: Install deps
        working-directory: newsletter
        run: npm ci

      - name: Sync published GitHub issues
        working-directory: newsletter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run news:sync

      - name: Build Astro static site
        working-directory: newsletter
        run: npm run build

      - name: Deploy to gh-pages (digest/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: newsletter/dist
          destination_dir: digest
          keep_files: true
