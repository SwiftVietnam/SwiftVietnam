name: Sync & Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "digest-deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: newsletter/package-lock.json

      - name: Install deps
        working-directory: newsletter
        run: npm ci

      - name: Sync published GitHub issues
        working-directory: newsletter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run news:sync

      - name: Build Astro static site
        working-directory: newsletter
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: newsletter/dist
